# Screening of the CWRU records according to Smith & Randall (MSSP 2015).
#
# Source: `literature/pdf/smith2015cwru.pdf`, Tables 5 and 6, page 36.
# Extracted from the PDF text on 2026-09-03.
#
# WHY THIS EXISTS
# ---------------
# A large share of the CWRU records is not diagnosable even at full rate. Measuring
# degradation by undersampling on such a record measures noise, not degradation -
# and produces a flat curve that would be read as a failure of the method. See the note in
# `literature/notes/smith2015cwru.md`.
#
# Quoting the authors on Table 5: the records with classical symptoms
# "could be considered valid training sets for machine learning algorithms".
# And on Table 6: the non-diagnosable ones "might provide a robust test for any
# newly proposed diagnostic algorithms".
#
# IDENTIFIER CONVENTION
# ---------------------
# "120DE" = record 120, drive end measurement point. No suffix = applies to all
# the measurement points of that record.
#
# TABLE 5 MARKERS (footnote of the paper)
#   no marker : Y1 diagnosis obtained with Method 1 (raw signal)
#   *         : Y1 obtained with Method 2 (cepstral pre-whitening), not with Method 1
#   +         : Y1 obtained with Method 3 (benchmark), not with Method 1
# Here the markers were removed from the identifiers and recorded in
# `harder_than_method1`, because they affect the difficulty and may become a separate
# experimental condition.

source:
  citekey: smith2015cwru
  tables: [5, 6]
  page: 36
  extracted: 2026-09-03

# Extracting a multi-column table from PDF text is fallible. The drive end rows
# came out clean and unambiguous. The fan end row of Table 5 has an uncertain column
# assignment in the extracted text - hence the field below.
verification:
  human_checked: false
  note: >-
    Check against page 36 of the PDF before using in a paper. The drive end rows
    (12 kHz and 48 kHz) of both tables were read without ambiguity.
    The fan end row of Table 5 has an uncertain column separation between "Ball",
    "OR orthogonal" and "OR opposite"; the content of the records is correct, it is
    the assignment to the fault type that needs a visual check.
  reliable_subsets: [drive_end_12k, drive_end_48k]

# --------------------------------------------------------------------------
# Table 6 - NOT diagnosable by any of the methods (only N1 or N2).
# Exclude from E02. Clean, unambiguous extraction.
# --------------------------------------------------------------------------
undiagnosable:
  drive_end_12k:
    inner_race: [3001, 3002, 3003, 3004]
    ball: [118, 119, 120DE, 120BA, 121BA, 187FE, 224DE, 224BA, 225DE, 225FE]
    outer_race_centred: [197FE, 197BA, 198FE, 198BA, 199FE, 200]
    outer_race_orthogonal: []
    outer_race_opposite: []
  drive_end_48k:
    inner_race: [174]
    ball: [122, 123, 124, 125, 192, 228DE, 229DE]
    outer_race_centred: [202FE, 204FE]
    outer_race_orthogonal: []
    outer_race_opposite: []
  fan_end_12k:
    inner_race: []
    ball: [282FE, 285FE, 290DE, 290FE, 292FE, 293DE]
    outer_race_centred: []
    outer_race_orthogonal: [298BA]
    outer_race_opposite: [302, 305FE, 306, 307]

# --------------------------------------------------------------------------
# Table 5 - classical fault symptoms, Y1 diagnosis with at least one method.
# It is the preferred set for E02.
# --------------------------------------------------------------------------
classical:
  drive_end_12k:
    inner_race: [209DE, 209FE, 210DE, 211DE, 212DE]
    ball: []
    outer_race_centred: [130, 131, 132, 133]
    outer_race_orthogonal:
      [144DE, 144BA, 145DE, 145FE, 145BA, 146DE, 146FE, 146BA, 147DE, 147FE, 147BA]
    outer_race_opposite: [156DE, 156FE, 159DE, 160DE]
  drive_end_48k:
    inner_race: [213, 215FE]
    ball: []
    outer_race_centred: [135, 136, 137, 138]
    outer_race_orthogonal: [148, 149, 150, 151]
    outer_race_opposite: [161DE, 162, 163DE, 163FE, 164]
  fan_end_12k:
    inner_race: [278DE, 278FE, 279DE, 280DE, 280BA, 281DE]
    ball:
      [274FE, 275FE, 276FE, 276BA, 277FE, 277BA, 271DE, 271FE, 271BA,
       272DE, 272FE, 272BA, 273DE, 273FE, 273BA]
    outer_race_centred: []
    outer_race_orthogonal: [313DE, 313FE, 315DE]
    outer_race_opposite:
      [310DE, 310FE, 309DE, 311DE, 311FE, 312DE, 312FE, 317DE, 317FE, 317BA]

# Records whose Y1 was only obtained with cepstral pre-whitening (Method 2) or with
# the benchmark (Method 3), and not with the raw signal (Method 1). They are the hardest
# cases within the classical category, and count as an experimental condition of their own.
harder_than_method1:
  method2_only:
    [209FE, 144DE, 145DE, 146DE, 147DE, 156DE, 156FE, 159DE, 160DE, 215FE, 161DE,
     162, 163DE, 163FE, 164, 275FE, 276FE, 276BA, 277FE, 277BA, 271DE, 271FE,
     271BA, 272DE, 272FE, 272BA, 273DE, 273BA, 313DE, 313FE, 315DE, 310DE, 310FE,
     311DE, 311FE, 312DE, 312FE]
  method3_only: [146FE, 146BA, 163DE, 164, 278FE, 279DE, 280DE, 280BA, 281DE,
                 277FE, 271FE, 272DE, 273DE, 309DE, 317BA]

# Records that appear to be clipped in sections (section 6 of the paper). Check before
# using: clipping is a nonlinearity and contaminates any spectral analysis.
clipped_in_sections: [191DE, 214DE, 215DE, 228DE, 229DE, 236DE, 237DE]
