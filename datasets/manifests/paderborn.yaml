name: paderborn
full_name: Paderborn University KAt-DataCenter bearing dataset
url: https://mb.uni-paderborn.de/en/kat/research/bearing-datacenter
download_url: https://groups.uni-paderborn.de/kat/BearingDataCenter/
license: >
  CC BY-NC 4.0 (checked on 2026-11-12 on the official page): "The data is licensed under the
  Creative Commons Attribution-NonCommercial 4.0 International Licence." "Non-commercial
  academic use of the data is permitted, but a citation of the source is required."
  The raw data is neither versioned nor redistributed.
citation: >
  Christian Lessmeier et al., KAt-DataCenter: mb.uni-paderborn.de/en/kat/research/bearing-datacenter,
  Chair of Design and Drive Technology, Paderborn University. Paper: Lessmeier, Kimotho, Zimmer
  and Sextro, "Condition Monitoring of Bearing Damage in Electromechanical Drive Systems by Using
  Motor Current Signals of Electric Motors: A Benchmark Data Set for Data-Driven
  Classification", European Conference of the PHM Society 2016 (PHME16).
fs_hz: [64000]  # vibration and currents; inferred from the file (256001 samples in 4 s)
channels:
  vibration_1: {raster: HostService, fs_hz: 64000, note: PCB 336C04 accelerometer on the module adapter}
  phase_current_1: {raster: HostService, fs_hz: 64000}
  phase_current_2: {raster: HostService, fs_hz: 64000}
  speed: {raster: Mech_4kHz, fs_hz: 4000, unit: rpm}
  force: {raster: Mech_4kHz, fs_hz: 4000, unit: N}
  torque: {raster: Mech_4kHz, fs_hz: 4000, unit: Nm}
  temp_2_bearing_module: {raster: Temp_1Hz, fs_hz: 1}
structure: >
  <code>/<setting>_<code>_<n>.mat, n = 1..20, MATLAB 5. A single variable named after the
  file; a struct with Info, X (time axes per raster), Y (signals: Name, Raster, Data, ...),
  Description. Each folder also holds the bearing's data sheet <code>.pdf.
operating_conditions:  # "operating conditions" page, checked on 2026-11-12
  N15_M07_F10: {rpm: 1500, torque_nm: 0.7, radial_force_n: 1000}
  N09_M07_F10: {rpm: 900, torque_nm: 0.7, radial_force_n: 1000}
  N15_M01_F10: {rpm: 1500, torque_nm: 0.1, radial_force_n: 1000}
  N15_M07_F04: {rpm: 1500, torque_nm: 0.7, radial_force_n: 400}
measurements: 20 per setting, 4 s each; temperature kept at ~45-50 C
bearing:
  type: 6203 ball bearing (FAG, MTK and IBU/IBB; PHME16, section 3)
  manufacturer_spread: >
    "the characteristic kinematic frequencies do not vary more than 1-2%" (PHME16, section 3).
geometry:  # PHME16, table 1 (FAG)
  n_elements: 8
  ball_diameter_mm: 6.75
  pitch_diameter_mm: 28.55
  contact_angle_deg: 0
  computed_orders: {BPFO: 3.0543, BPFI: 4.9457}  # 4 (1 -+ d/D), d/D = 0.23643
  measured_orders: >
    Check of 2026-11-12 (datasets/scripts/paderborn_suitability.py, N15_M07_F10, full rate):
    KA01 3.060; KI01 and KI18 4.931. Within 0.2-0.3 % of the computed ones.
bearings:  # PHME16, tables 4 and 5; "data sets and download" page (6 healthy, 12 artificial, 14 real)
  healthy: [K001, K002, K003, K004, K005, K006]
  artificial:
    outer: {KA01: [1, EDM], KA03: [2, engraver], KA05: [1, engraver], KA06: [2, engraver],
            KA07: [1, drilling], KA08: [2, drilling], KA09: [2, drilling]}
    inner: {KI01: [1, EDM], KI03: [1, engraver], KI05: [1, engraver], KI07: [2, engraver],
            KI08: [2, engraver]}
  real:  # accelerated lifetime test; [level, symptom, combination]
    outer: {KA04: [1, pitting, S], KA15: [1, indentations, S], KA16: [2, pitting, R],
            KA22: [1, pitting, S], KA30: [1, indentations, R]}
    inner: {KI04: [1, pitting, M], KI14: [1, pitting, M], KI16: [3, pitting, S],
            KI17: [1, pitting, R], KI18: [2, pitting, S], KI21: [1, pitting, S]}
    combined: {KB23: [2, pitting, "IR (+OR)"], KB24: [3, pitting, "IR (+OR)"],
               KB27: [1, indentations, "OR + IR"]}
rig: >
  425 W PMSM, 4 pole pairs, driven by a KEB Combivert inverter with 16 kHz switching
  (PHME16, section 4.1). The currents go through a 25 kHz low-pass filter before being
  sampled at 64 kHz.
notes: |
  INGESTED ON 2026-11-12 on the remote server, in datasets/raw/paderborn (outside git): 32
  files, 2560 .mat, 21 GB extracted. The .rar files are RAR4; the server's 7z lacks the codec,
  and the extraction uses unrar-cffi (datasets/scripts/extract_rar.py).
  readme_versions.txt: "2016-07-13: update of profile of bearing damage KI03 (correction of
  mistakes in description of damage geometry)".
  Suitability check (2026-11-12, full rate, level-4 kurtogram with a 500 Hz floor):
  - The fault line appears and separates from the shaft harmonic in KA01 (EDM), KI01 (EDM) and
    KI18 (real, level 2). It does not appear in KA05, KA07, KI05 (artificial, level 1), KA04,
    KA15, KA22, KI04, KI14 (real, level 1).
  - In the real outer-race bearings, the peak of the BPFO window is the 3rd shaft harmonic
    (2.98-3.01). The BPFO lies 0.054 order from 3.0 and the BPFI 0.054 order from 5.0: with the
    Ottawa tolerance of 0.06 order, locking onto the harmonic would count as a hit. On this
    dataset the tolerance has to stay below ~0.027 order. The resolution of 4 s is 0.010 order
    at 1500 rpm and 0.017 at 900 rpm.
  - The kurtogram chooses 11-21.5 kHz in most records without a line, a range that contains the
    inverter's 16 kHz switching. Hypothesis for Part 1 of ADR 0006, not tested.
