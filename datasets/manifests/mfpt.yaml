name: mfpt
full_name: Society for Machinery Failure Prevention Technology bearing dataset
url: https://www.mfpt.org/fault-data-sets/
license: conferir termos antes de redistribuir
fs_hz: [48828, 97656]
notes: |
  Taxa mais alta entre os datasets-ancora. E o unico que permite testar fatores
  de subamostragem grandes (32x, 64x) sem sair da regiao onde ha verdade
  fundamental confiavel.
undersampling:
  method: decimacao_pura
  factors: [2, 4, 8, 16, 32, 64, 128]
