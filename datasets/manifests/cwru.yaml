name: cwru
full_name: Case Western Reserve University Bearing Data Center
url: https://engineering.case.edu/bearingdatacenter
license: uso academico com citacao; conferir termos antes de redistribuir
fs_hz: [12000, 48000]
channels: [drive_end, fan_end, base]
bearing:
  drive_end: CWRU_6205_2RS_JEM_SKF
notes: |
  Referencia universal do dominio. A 48 kSPS ha margem confortavel para
  subamostragem artificial com verdade fundamental exata.
  Risco: dataset saturado na literatura de classificacao. Este projeto NAO o usa
  para classificar - usa para medir erro de estimacao de frequencia de falha,
  que e verdade continua e muito mais informativa.
undersampling:
  method: decimacao_pura
  forbidden: filtro anti-aliasing antes de decimar
  factors: [2, 4, 8, 16, 32]
