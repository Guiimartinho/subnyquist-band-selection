name: cwru
full_name: Case Western Reserve University Bearing Data Center
url: https://engineering.case.edu/bearingdatacenter
license: academic use with citation; check the terms before redistributing
fs_hz: [12000, 48000]
channels: [drive_end, fan_end, base]
bearing:
  drive_end: CWRU_6205_2RS_JEM_SKF
notes: |
  The universal reference of the field. At 48 kSPS there is a comfortable margin for
  artificial undersampling with exact ground truth.
  Risk: the dataset is saturated in the classification literature. This project does NOT use
  it to classify - it uses it to measure the estimation error of the fault frequency,
  which is a continuous truth and much more informative.
undersampling:
  method: decimacao_pura
  forbidden: anti-aliasing filter before decimating
  factors: [2, 4, 8, 16, 32]
