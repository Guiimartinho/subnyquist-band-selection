name: xjtu-sy
full_name: XJTU-SY rolling element bearing run-to-failure dataset
url: https://biaowang.tech/xjtu-sy-bearing-datasets/
license: academic use with citation
fs_hz: [25600]
notes: |
  Continuous degradation up to failure, with changes of operating regime. It is the right
  dataset to test the temporal prior and the disambiguation of the alias order by speed
  variation - the mechanism described in the SOTA review.
undersampling:
  method: decimacao_pura
  factors: [2, 4, 8, 16]
