name: ottawa2018
full_name: University of Ottawa constant/variable speed rolling-element bearing vibration dataset (2018)
url: https://data.mendeley.com/datasets/v43hmbwxpm/1
license: CC BY 4.0 - redistributable with attribution
fs_hz: [200000.0]
channels: [Channel_1 (accelerometer), Channel_2 (encoder)]
notes: |
  VERIFIED BY A DRY RUN ON 2026-09-03, not just read from the page.

  36 .mat files, ~12-15 MB each, 481 MB in total. Naming
  <condition>-<scenario>-<trial>.mat with condition in {H, I, O} (healthy, inner,
  outer), scenario in {A, B, C, D} and trial in {1, 2, 3}.
  Each record has 2,000,000 samples = 10 s at 200 kSPS, two columns.

  ENCODER: 1024 pulses per revolution. This is NOT obvious on the page and was
  determined empirically: it is the only candidate value that makes order 1 (shaft)
  appear in the order spectrum together with the BPFI. With 1024 ppr the speed is
  around 1172 rpm, with a wide variation over the 10 s.

  END-TO-END VALIDATION: record I-A-1 (inner race), resampled in angle, gives a
  dominant order of 5.43, which is the theoretical BPFI for 9 balls and ratio ~0.2,
  plus order 1 (shaft) and order 10.87 (second harmonic). The dataset label,
  the encoder resolution and the order analysis code confirm one another.

  INFORMATIVE BAND: 97% of the energy is in 0-50 Hz (structural content, not the
  fault). The resonant band of the fault, found by the kurtogram while ignoring everything
  below 500 Hz, is at 6.8-10 kHz with kurtosis 34.4 - against 3.88 for the best CWRU
  record. It is much more impulsive.

  REAL UNDERSAMPLING MARGIN: the 200 kSPS rate is oversampling; only 0.1% of the
  energy is above 20 kHz. What matters is the margin from the EFFECTIVE Nyquist
  of the informative band (2 x 10 kHz = 20 kSPS) down to the floor of the fault
  frequency (~700 Hz for 3 harmonics of the BPFI): about 28x of genuine sub-Nyquist
  operation. Much better than CWRU 12k, and with variable speed.

  CORRECTED BY E07 ON 2026-09-04, with the 24 fault records:

  - The BPFI order of 5.43 from the dry run is confirmed in the 12 inner-race records
    (5.376 to 5.431), with sidebands spaced by exactly 1.00 - the
    inner-race signature, and an independent confirmation of the 1024 ppr.
  - The catalogue geometry of the ER16K does NOT serve as ground truth. Predicted
    BPFO = 3.573; measured 3.414 in the 12 outer-race records, a deviation of -4.4%.
    The BPFI is off by only -0.5%. The measured sum 8.82 violates the identity BPFO + BPFI = n
    by 2%, which rules out pure cage slip as the sole explanation. The
    mechanism was not determined. USE CALIBRATED ORDERS, not the catalogue ones.
  - The deviation depends on the scenario: A and C (which start by accelerating) give higher
    orders than B and D (which start by decelerating).
  - KURTOGRAM SEARCH CEILING: limiting it to 25 kHz is mandatory. Without a ceiling, 12 of 12
    outer-race records choose 50-100 kHz - a range with 0.1% of the energy,
    where the kurtosis measures numerical leakage - and the fault does not appear at any
    order. With the ceiling, it appears at order 3.4 in all 12. The min_energy_frac guard
    of the kurtogram has too loose a threshold for this dataset.

undersampling:
  method: decimacao_pura
  effective_nyquist_hz: 20000.0
  fault_floor_hz: 700.0
  factors: [1, 2, 4, 8, 16, 24, 32, 48, 64, 96, 128]
  # Measured in E07: the accuracy does not degrade up to 64x (3.12 kSPS effective).

access:
  programmatic: true
  api: https://data.mendeley.com/public-api/datasets/v43hmbwxpm/files?folder_id=root&version=1
  note: the only candidate, along with CWRU, with a scripted download without registration
