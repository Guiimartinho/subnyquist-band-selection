name: mafaulda
full_name: MAFAULDA machinery fault database (UFRJ)
url: https://www02.smt.ufrj.br/~offshore/mfs/page_01.html
license: NAO DECLARADA na pagina oficial (conferido em 2026-11-11) - pedir termos ao contato antes de redistribuir
fs_hz: [51200]  # inferida; a pagina declara 50000 (ver notes)
channels:
  - tachometer
  - underhang_axial
  - underhang_radial
  - underhang_tangential
  - overhang_axial
  - overhang_radial
  - overhang_tangential
  - microphone
bearing:
  underhang: modelo nao declarado
  overhang: modelo nao declarado
notes: |
  INGERIDO EM 2026-11-11 no servidor remoto (snq_data.mafaulda), para o E21 (ADR 0006).
  TAXA REAL = 51,2 kHz, NAO os 50 kHz declarados: inferida nas 1120 sequencias por duas
  evidencias independentes - tacometro x nome do arquivo (razao mediana 1,0004 a 51,2 kHz
  contra 0,9769 a 50 kHz) e linha de rede de 120 Hz no microfone (863/1120 a +-0,15 Hz de
  117,19 Hz no eixo de 50 kHz, contra 3/1120 perto de 120 Hz). Cada sequencia dura 4,883 s.
  Fatos da pagina oficial, conferidos nesta data:
  - CSV, 8 colunas, 50 kHz, 5 s, 250.000 amostras por sequencia. Os modulos NI 9234
    amostram a 51,2 kHz, mas a pagina declara 50 kHz; o loader confere pela rotacao do
    tacometro contra a do nome do arquivo (a 51,2 kHz o desvio seria de 2,4 %).
  - Sensores: tacometro Monarch MT-190; acelerometros IMI 601A01 (tres) e IMI 604B31
    (triaxial), sem mapeamento explicito para as colunas; microfone Shure SM81. A banda
    dos acelerometros NAO esta na pagina: conferir o datasheet antes de argumentar sobre
    conteudo acima de ~10 kHz.
  - Rotacao: 737 a 3686 rpm nas sequencias normais; cada sequencia tem rotacao ~constante
    e o nome do arquivo e a rotacao nominal em Hz.
  - Falhas de rolamento: outer_race, ball_fault, cage_fault, nos mancais underhang e
    overhang, com massa adicional de 0, 6, 20 ou 35 g. NAO ha falha de pista interna.
  Estrutura: normal/<rot>.csv; <mancal>/<falha>/<massa>g/<rot>.csv.
geometry:
  n_elements: 8
  ball_diameter_cm: 0.7145
  pitch_diameter_cm: 2.8519
  contact_angle_deg: nao declarado (assumido 0)
  documented_orders: {FTF: 0.3750, BPFO: 2.9980, BPFI: 5.0020, BSF: 1.8710}
