name: mafaulda
full_name: MAFAULDA machinery fault database (UFRJ)
url: https://www02.smt.ufrj.br/~offshore/mfs/page_01.html
license: NOT DECLARED on the official page (checked on 2026-11-11) - ask the contact for terms before redistributing
fs_hz: [51200]  # inferred; the page declares 50000 (see notes)
channels:
  - tachometer
  - underhang_axial
  - underhang_radial
  - underhang_tangential
  - overhang_axial
  - overhang_radial
  - overhang_tangential
  - microphone
bearing:
  underhang: model not declared
  overhang: model not declared
notes: |
  INGESTED ON 2026-11-11 on the remote server (snq_data.mafaulda), for E21 (ADR 0006).
  REAL RATE = 51.2 kHz, NOT the declared 50 kHz: inferred on the 1120 sequences from two
  independent pieces of evidence - tachometer x file name (median ratio 1.0004 at 51.2 kHz
  against 0.9769 at 50 kHz) and the 120 Hz power-line component in the microphone (863/1120
  within +-0.15 Hz of 117.19 Hz on the 50 kHz axis, against 3/1120 near 120 Hz). Each sequence
  lasts 4.883 s.
  Facts from the official page, checked on this date:
  - CSV, 8 columns, 50 kHz, 5 s, 250,000 samples per sequence. The NI 9234 modules
    sample at 51.2 kHz, but the page declares 50 kHz; the loader checks the tachometer
    speed against the one in the file name (at 51.2 kHz the deviation would be 2.4 %).
  - Sensors: Monarch MT-190 tachometer; IMI 601A01 accelerometers (three) and IMI 604B31
    (triaxial), with no explicit mapping to the columns; Shure SM81 microphone. The band
    of the accelerometers is NOT on the page: check the datasheet before arguing about
    content above ~10 kHz.
  - Rotation speed: 737 to 3686 rpm in the normal sequences; each sequence has a ~constant
    speed, and the file name is the nominal speed in Hz.
  - Bearing faults: outer_race, ball_fault, cage_fault, on the underhang and overhang
    bearings, with an added mass of 0, 6, 20 or 35 g. There is NO inner-race fault.
  Structure: normal/<rot>.csv; <bearing>/<fault>/<mass>g/<rot>.csv.
geometry:
  n_elements: 8
  ball_diameter_cm: 0.7145
  pitch_diameter_cm: 2.8519
  contact_angle_deg: not declared (assumed 0)
  documented_orders: {FTF: 0.3750, BPFO: 2.9980, BPFI: 5.0020, BSF: 1.8710}
  # Checked in packages/snq-data/tests/test_mafaulda.py: a zero angle reproduces all four
  # (FTF 0.3747; BPFO 2.9978; BPFI 5.0022; BSF 1.8705).
archives:
  base_url: https://www02.smt.ufrj.br/~offshore/mfs/database/mafaulda
  # The page does not publish checksums; these are the sha256 of the files downloaded on 2026-11-11.
  normal.tgz: {bytes: 325273545, sha256: 58482537c3d31ddb5508adee7001d2ada1ecf6adfa7995d708c5954c7578e43d}
  underhang.tgz: {bytes: 3679220896, sha256: 4399ddf9a895cf2ef4d26ae56e8702ea50c4833d623c7f60c77ae8582ccc7338}
  overhang.tgz: {bytes: 3374774113, sha256: e694372d0a6a08c7b8afa919295f27842ba25efdb159a6e8be1f195c67f6f8b2}
undersampling:
  method: decimacao_pura
  factors: [1, 2, 3, 4, 6, 8, 12, 16]
