[project]
name = "subnyquist"
version = "0.1.0"
description = "Sub-Nyquist acquisition for embedded condition monitoring: code for the MSSP paper"
requires-python = ">=3.11"
dependencies = [
    "snq-core",
    "snq-sim",
    "snq-data",
    "snq-recon",
    "snq-eval",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "matplotlib>=3.9", "pyyaml>=6"]
learn = ["torch>=2.4"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
snq-core  = { workspace = true }
snq-sim   = { workspace = true }
snq-data  = { workspace = true }
snq-recon = { workspace = true }
snq-learn = { workspace = true }
snq-eval  = { workspace = true }
snq-embed = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "NPY"]

[tool.ruff.lint.per-file-ignores]
# In the tests, "from snq_core import sampling as S" is a deliberate convention:
# it makes explicit which module each identity under test comes from.
"**/tests/*" = ["N812"]
"**/test_*.py" = ["N812"]

[tool.mypy]
# 3.12 is mypy's *parsing* target, not the runtime: the numpy >= 2.4 stubs use the
# PEP 695 "type X = ..." syntax, which mypy accepts only from 3.12 on.
# The project runtime is still 3.11 (see requires-python).
python_version = "3.12"
strict = true
files = ["packages/snq-core/src", "packages/snq-eval/src"]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "-q --strict-markers"
