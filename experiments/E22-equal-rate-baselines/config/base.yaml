# E22 - published baselines at the same samples/s rate (ADR 0006). Phase 1.
seed: 20261112

datasets:
  ottawa:
    data_dir: datasets/raw/ottawa
    conditions: [I, O]
    scenarios: [A, B, C, D]
    trials: [1, 2, 3]
    pulses_per_rev: 1024
    segment_samples: 500000
    # segment 0 = calibration; 1 and 2 = test
    calibration_segment: 0
    test_segments: [1, 2]
    ceiling0_hz: 25000.0          # E07 ceiling
    nominal: {n_elements: 9, geom_ratio: 0.206}
    budgets: [4, 8, 16, 32]       # budget rate = acquisition rate / budget
    factor_grid_max: 48
  mafaulda:
    data_dir: datasets/raw/mafaulda
    cache_dir: datasets/processed/mafaulda
    screen_catalog: datasets/catalogs/mafaulda-tachometer-screen.yaml
    bearings: [underhang, overhang]
    fault: outer_race
    fault_family: BPFO
    axis: radial
    # 1st half = calibration; 2nd half = test
    ceiling0_hz: null             # no ceiling beyond the effective Nyquist
    budgets: [4, 8, 16]
    factor_grid_max: 16

min_samples: 4096
kurtogram:
  max_level: 4
  f_min_hz: 500.0
prior:
  score_harmonics: 3
  calibration_span: 0.12
tolerance_order: 0.06
samples_per_rev: 64
order_min: 2.0

tat:
  folded_share_threshold: 0.5
  # uniform_ceiling: candidate ceilings as a fraction of ceiling0 (the highest admissible wins)
  ceiling_fractions: [1.0, 0.5, 0.25]

cs:   # random_cs arm: identical to E13 (sensors2025csvibration), envelope after reconstruction
  order_min: 0.5
  order_max: 24.0
  order_step_per_rev: 1.0
  n_atoms: 40
  residual_tol: 0.0
  min_gap_samples: 1
  cs_samples_per_rev: 48
  max_dictionary_elements: 3.0e+8

# despike: pre-registered on 2026-11-11 (adversarial review of E20).
arms: [uniform, despike, uniform_ceiling, tat_rate, random_cs, bandpass_lu]

compute:
  workers: 30

output:
  results_dir: results
