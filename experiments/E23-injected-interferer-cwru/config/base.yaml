# E23 - impulsive interferer injected into CWRU 48k (ADR 0006, post-E21 update).
seed: 20261113

catalog: datasets/catalogs/cwru-smith2015-categories.yaml
subset: drive_end_48k
point: DE
data_dir: datasets/raw/cwru
fs_hz: 48000.0

min_samples: 4096
estimate_f_min_hz: 20.0      # floor of the no-prior estimate (as in E02)
tolerance_hz: 2.0            # as in E02
kurtogram:
  max_level: 5
  f_min_hz: 500.0
# Full-rate search ceiling: excludes the interferer at 1x, like E07's 25 kHz on Ottawa.
ceiling0_hz: 10000.0
# Crossed ceilings in the uniform arm: the same signal at the same factor has predicted capture
# under one ceiling and not under another (the image lands above the ceiling). Capped at fs_eff/2.
search_ceilings_hz: [10000.0, 5000.0, 2500.0]

injection:
  # Exponential bursts on a carrier fc, at a rate that is not an order of the shaft or of the fault.
  burst_rate_hz: 97.7
  burst_tau_s: 0.0005           # kurtosis ~30; FWHM 1/(pi*tau) ~ 640 Hz
  carriers_hz: [13000.0, 16000.0, 19000.0, 22000.0]
  # Interferer power relative to the record's power in the band that the kurtogram chooses
  # at full rate, in the calibration without injection.
  # Extended to +20 dB after the smoke run (2 records, 16 kHz, 0 dB: no capture).
  relative_power_db: [-10.0, 0.0, 10.0, 20.0]
  # surrogate: the same realization with random phases (same power spectrum, kurtosis ~3).
  kinds: [impulsive, surrogate]

# Arithmetic prediction of H1: fraction of the interferer power whose image falls in the search range.
prediction:
  capture_share: 0.5         # >= : predicted capture
  clear_share: 0.05          # <  : no predicted capture; in between: borderline, outside the criterion

sweep:
  undersampling_factor: [1, 2, 3, 4, 5, 6, 7, 8, 10, 12]

tat:
  folded_share_threshold: 0.5
  ceiling_fractions: [1.0, 0.5, 0.25]

# Pre-registered criteria (written before the 1st run; see README).
analysis:
  # Sensitivity at the maximum power; specificity at all powers; the surrogate at P*, the lowest
  # power at which the impulsive knocks down the predicted cells by >= drop_points on average.
  evaluable_baseline: 0.5    # evaluable cell: uniform arm without injection hits >= 50 %
  drop_points: 20            # H1: minimum drop against the same factor without injection
  predicted_fraction: 0.8    # H1: fraction of the evaluable predicted cells that must drop
  refute_fraction: 0.5       # H1 refuted below this
  clear_false_alarm: 0.2     # H1: at most this fraction of the cells with no predicted capture drops
  surrogate_ratio: 0.5       # H1: mean surrogate drop < 0.5 x that of the impulsive
  surrogate_refute_ratio: 0.8
  tat_min_balanced_accuracy: 0.8
  tat_refute_balanced_accuracy: 0.65
  oracle_gap_points: 5
  bootstrap: 2000

compute:
  workers: 30

output:
  results_dir: results
