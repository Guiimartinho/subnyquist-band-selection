# E23 - interferente impulsivo injetado no CWRU 48k (ADR 0006, atualizacao pos-E21).
seed: 20261113

catalog: datasets/catalogs/cwru-smith2015-categories.yaml
subset: drive_end_48k
point: DE
data_dir: datasets/raw/cwru
fs_hz: 48000.0

min_samples: 4096
estimate_f_min_hz: 20.0      # piso da estimativa sem prior (como o E02)
tolerance_hz: 2.0            # como o E02
kurtogram:
  max_level: 5
  f_min_hz: 500.0
# Teto da busca em taxa cheia: exclui o interferente em 1x, como os 25 kHz do E07 no Ottawa.
ceiling0_hz: 10000.0
# Tetos cruzados no braco uniforme: o mesmo sinal no mesmo fator tem captura prevista num teto
# e nao noutro (a imagem cai acima do teto). Capados em fs_eff/2.
search_ceilings_hz: [10000.0, 5000.0, 2500.0]

injection:
  # Rajadas exponenciais numa portadora fc, a uma taxa que nao e ordem do eixo nem da falha.
  burst_rate_hz: 97.7
  burst_tau_s: 0.0005           # curtose ~30; FWHM 1/(pi*tau) ~ 640 Hz
  carriers_hz: [13000.0, 16000.0, 19000.0, 22000.0]
  # Potencia do interferente relativa a potencia do registro na banda que o kurtograma escolhe
  # em taxa cheia, na calibracao sem injecao.
  # Estendida a +20 dB depois da fumaca (2 registros, 16 kHz, 0 dB: nenhuma captura).
  relative_power_db: [-10.0, 0.0, 10.0, 20.0]
  # surrogate: mesma realizacao com fases aleatorias (mesmo espectro de potencia, curtose ~3).
  kinds: [impulsive, surrogate]

# Previsao aritmetica de H1: fracao da potencia do interferente cuja imagem cai na faixa de busca.
prediction:
  capture_share: 0.5         # >= : captura prevista
  clear_share: 0.05          # <  : sem captura prevista; entre os dois: borda, fora do criterio

sweep:
  undersampling_factor: [1, 2, 3, 4, 5, 6, 7, 8, 10, 12]

tat:
  folded_share_threshold: 0.5
  ceiling_fractions: [1.0, 0.5, 0.25]

# Criterios pre-registrados (escritos antes da 1a rodada; ver README).
analysis:
  # Sensibilidade na potencia maxima; especificidade em todas; o substituto em P*, a menor
  # potencia em que o impulsivo derruba em media >= drop_points as celulas previstas.
  evaluable_baseline: 0.5    # celula avaliavel: braco uniforme sem injecao acerta >= 50 %
  drop_points: 20            # H1: queda minima contra o mesmo fator sem injecao
  predicted_fraction: 0.8    # H1: fracao das celulas previstas avaliaveis que precisa cair
  refute_fraction: 0.5       # H1 refutada abaixo disto
  clear_false_alarm: 0.2     # H1: no maximo esta fracao das celulas sem captura prevista cai
  surrogate_ratio: 0.5       # H1: queda media do substituto < 0,5 x a do impulsivo
  surrogate_refute_ratio: 0.8
  tat_min_balanced_accuracy: 0.8
  tat_refute_balanced_accuracy: 0.65
  oracle_gap_points: 5
  bootstrap: 2000

compute:
  workers: 30

output:
  results_dir: results
