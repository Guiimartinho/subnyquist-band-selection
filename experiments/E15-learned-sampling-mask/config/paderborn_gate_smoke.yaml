# SMOKE test of the Paderborn gate: only checks the code path; it is not a result.
# E15: power gate on Paderborn (README, "Power gate on Paderborn (preregistration)").
# Preregistration: written and committed before running. Changing it after seeing a number
# invalidates it.
seed: 20261112
data_dir: datasets/raw/paderborn
# 1500 rpm: 4 s give 100 revolutions and a resolution of 0.010 order. The 900 rpm one (0.017) is
# left out, because the 0.025 tolerance would be only 1.5 bins.
settings: [N15_M07_F10]
# cluster = bearing; race = group. The combined ones (KB) are left out, because the order family
# is ambiguous; the healthy ones do not enter the gate.
outer: [KA01, KA04, KA05, KA15]
inner: [KI01, KI18, KI04, KI05]
calibration_measurement: 1           # nested ruler: calibration from measurement 1 of each record
test_measurements: [2, 3]
ceiling0_hz: null                    # kurtogram ceiling = effective Nyquist
budgets: [4, 8, 16, 32]
factor_grid_max: 48
# 2.0 (Ottawa's) would only allow running up to factor 20 at 25 Hz shaft speed and would remove
# 1/32; 1.0 is what E15 uses on CWRU for the same reason (64 points per revolution: factor <= 40)
guard_points_per_rev_factor: 1.0
# classical pipeline identical to E15's (config/base.yaml), with two changes forced by the
# geometry (BPFO and BPFI at 0.054 order from shaft harmonics 3 and 5):
min_samples: 4096
kurtogram: {max_level: 4, f_min_hz: 500.0}
samples_per_rev: 64
order_min: 2.0
tolerance_order: 0.025               # < half of 0.054; 2.5 bins at 1500 rpm
prior: {score_harmonics: 3, calibration_span: 0.01}   # +-1 %: excludes 3.0 and 5.0 from the search
# the local ruler only holds if the line is visible at full rate: a peak within +-0.015 order of
# the refined center of at least 5 times the median of the +-7 % window around the nominal. The
# adequacy check gave 14-141 on the visible lines and 0.3-2.5 on the absent ones (the harmonic
# reached 5.6 outside the +-1 % search).
min_line_prominence: 5.0
prominence_window: 0.07
splits: {kind: kfold_bearing, n_folds: 4}
power_gate:
  effects: [5, 10, perfect]
  designs: {D0: 1, D1: 3, D2: 5}     # seeds of the planted arm
  n_sim: 5
  n_sim_perfect: 2
  n_boot: 200
  alpha: 0.05
  min_budgets: 2
  criterion: {effect: 5, power: 0.80, rule: optimistic}
