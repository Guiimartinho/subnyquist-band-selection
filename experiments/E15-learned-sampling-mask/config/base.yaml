# E15 - learned sampling mask under a feasible set (ADR 0006, Part 2). Runs on the GPU.
#
# Protocol corrected on 2026-11-11 by the adversarial review (see the README, "Corrections from
# the review" and "Preregistration"). The deciding test is in the `preregistration` block and in
# the README; changing either of them after seeing a number invalidates the preregistration.
#
# Datasets: only Ottawa decides. CWRU 48k is out of the decision (option (b) of the review): 12
# outer-race records, 1 inner-race record that never goes to test, a single class in the test
# set and 3 physical units. It stays disabled, with the adapter ready. MAFAULDA also stays
# disabled: on its bearing, BPFO and BPFI coincide with the 3rd and 5th shaft harmonics (E21).
seed: 20261113

datasets:
  ottawa:
    enabled: true
    kind: ottawa
    data_dir: datasets/raw/ottawa
    conditions: [I, O]
    scenarios: [A, B, C, D]
    trials: [1, 2, 3]
    pulses_per_rev: 1024
    segment_samples: 500000
    calibration_segment: 0           # nested ruler: calibration from segment 0, as in E22
    test_segments: [1, 2]
    ceiling0_hz: 25000.0             # E07/E22 ceiling
    nominal: {n_elements: 9, geom_ratio: 0.206}
    # Add 48 and 64 here, if desired. Do not use 96 to 160 as a target: there the kurtogram
    # picks bands narrower than the fault in Hz, and the wall is the pipeline's, not the rate's.
    budgets: [4, 8, 16, 32]
    factor_grid_max: 48
    guard_points_per_rev_factor: 2.0 # the E22 guard
    min_gap_ticks: 2                 # 10 us at 200 kSPS; the value achievable on the SAADC is a bench measurement not yet made
    # Corrected run (user's decision, 2026-11-12): only the deciding variant, `raw`. The
    # `despiked` one (requires full rate, decides nothing) is left for a later secondary run.
    despike_variants: [false]
    healthy_control: {enabled: true, conditions: [H]}
    window_samples: 500000           # training window = segment (2.5 s), and the local ruler's excerpt
    # local ruler: full-rate refinement on a sliding grid of `window_samples` windows
    local_calibration: {hop_samples: 50000}
    decoder: {fs_env_hz: 2048.0, spr_ang: 256, n_fft: 32768}
  cwru48k:
    enabled: false                   # OUT OF THE DECISION (option (b) of the review), see the header
    kind: cwru
    data_dir: datasets/raw/cwru
    catalog: datasets/catalogs/cwru-smith2015-categories.yaml
    table: classical
    subset: drive_end_48k
    point: DE
    fs_hz: 48000.0
    ceiling0_hz: null
    budgets: [2, 4, 8, 16]
    factor_grid_max: 24
    guard_points_per_rev_factor: 1.0 # 2.0 would discard every factor above 12 at ~30 Hz shaft speed
    min_samples: 2048                # 4096 would discard the halves of 148 and 161 at 1/16
    min_gap_ticks: 1
    despike_variants: [false]
    window_samples: 61440
    local_calibration: {hop_samples: 24000}
    decoder: {fs_env_hz: 2048.0, spr_ang: 128, n_fft: 32768}
  mafaulda:
    enabled: false                   # OPTION DISABLED, see the header
    kind: mafaulda
    data_dir: datasets/raw/mafaulda
    cache_dir: datasets/processed/mafaulda
    screen_catalog: datasets/catalogs/mafaulda-tachometer-screen.yaml
    bearings: [underhang, overhang]
    fault: outer_race
    fault_family: BPFO
    axis: radial
    ceiling0_hz: null
    budgets: [4, 8, 16]
    factor_grid_max: 16
    guard_points_per_rev_factor: 2.0
    min_gap_ticks: 1
    despike_variants: [false]
    window_samples: 102400
    local_calibration: {hop_samples: 51200}
    decoder: {fs_env_hz: 4096.0, spr_ang: 512, n_fft: 131072}

# classical pipeline: identical to E22
min_samples: 4096
kurtogram: {max_level: 4, f_min_hz: 500.0}
prior: {score_harmonics: 3, calibration_span: 0.12}
tolerance_order: 0.06
samples_per_rev: 64
order_min: 2.0
order_max: 32.0                      # = samples_per_rev/2: the same argmax range as in E22
despike: {k_mad: 10.0}               # E20/E22 criterion

feasible:
  active_per_period: 4               # K; the period is L = K x budget
  timer_clock_hz: 16000000.0         # only to check that the TIMER counts come out as integers

protocol:                            # per-record splits (E05 framework)
  n_splits: 5
  # One training seed per split: the seed variability is CONFOUNDED with the split variability,
  # and the bootstrap resamples the splits (preregistration). Raising this number separates the
  # two sources; the rows get the `seed` column and the per-record mean is taken over them.
  seeds_per_split: 1
  test_fraction: 0.25
  val_fraction: 0.25

training:
  max_epochs: 500
  patience: 40
  windows_per_epoch: 64
  batch_size: 8
  # A single rate, the same for all learned methods: an equal, zero tuning budget.
  lr_grid: [0.003]
  weight_decay: 0.0
  grad_clip: 5.0
  spacing_penalty: 1.0
  tau_start: 2.0
  tau_end: 0.3
  tau_anneal_epochs: 100
  # Rule B5, 2nd application (2026-11-11): with lr x30, 1/16 stayed at 2/5; the 8 splits that did
  # not converge stopped before the end of annealing (best epoch 22-84 < 100). Early stopping and
  # checkpoint selection only count after annealing, in the arms with a learned mask.
  stop_after_anneal: true

decoder:
  init_levels: [1, 1.585, 2]         # kurtogram bands: 2 + 3 + 4 = 9 channels
  shifts: [-2, -1, 0, 1, 2]          # fs/L shifts of the LPTV bank (R = 5 >= K = 4)
  n_control: 1024
  transition_frac: 0.1
  envelope_power: 2
  selection: sk
  sk_guard_frac: 0.05
  beta_init: 2.0

methods:
  - dec_uniform
  - dec_random
  - dec_multicoset
  - dec_multicoset_vb
  - dec_uniform_trained
  - dec_learned
  - dec_free
  - dec_adaptive
  - wdcnn
  # dec_loupe: optional (LOUPE with straight-through); the H2 projection gap uses dec_free

mask:
  init: flat
  init_scale: 0.01
  relaxation: topk_st
  # The mask has its own learning rate: with the decoder's (0.003) and 8 steps per epoch, the
  # logits do not get out of the Gumbel noise (std ~1.28). The output diagnostics are in
  # masks.json (top-K margin, initial and final positions).
  # Rule B5 applied on 2026-11-11: in the run with 10, mask_converged_frac of dec_learned
  # (raw) was 0.6 / 0.4 / 0.4 / 0.2 at 1/4 to 1/32 -> redo with 30 (see README).
  lr_multiplier: 30.0
free: {period_multiple: 4}           # horizon of the unconstrained mask: 4 periods, 4K positions
loupe: {slope: 5.0, sample_slope: 12.0, period_multiple: 1}
adps: {n_blocks: 4, n_features: 16, hidden: 32}
multicoset: {criterion: min_peak_alias, max_enumeration: 3000000}
wdcnn: {input_length: 2048, batch_size: 64, windows_per_epoch: 512, max_val_windows_per_segment: 16}

# PREREGISTRATION (mirror of the README; the README is the reference record)
preregistration:
  dataset: ottawa
  variant: raw
  rulers: [local, nested]            # H1 and H2 only hold if the two rulers agree
  metric: balanced order accuracy (mean over races of the hit |est - ruler| < 0.06)
  alpha: 0.05
  correction: holm                   # over the tests of each hypothesis, per ruler
  min_budgets: 2
  min_clusters_per_group: 3         # a test with fewer clusters per race is not eligible (p = 1)
  min_splits: 2
  # B5, evaluability (2026-11-12, before any test number of the corrected run): a budget is only
  # evaluable in a hypothesis if the mask of every arm in `convergence_arms` got out of the noise
  # in at least this fraction of the splits; otherwise, its tests enter Holm with p = 1.
  min_mask_converged_frac: 0.5
  h1:
    arm: dec_learned_sel
    baselines: [uniform_trained, dec_uniform_trained, dec_random]
    convergence_arms: [dec_learned, dec_learned_sel]  # B5 as preregistered + mask used
  h2:
    arm: dec_learned
    baseline: dec_free_projected
    convergence_arms: [dec_learned, dec_free_projected]  # without this, a baseline stuck in the noise

analysis: {bootstrap_resamples: 4000}

compute: {workers: 30, device: auto}
output: {results_dir: results}
