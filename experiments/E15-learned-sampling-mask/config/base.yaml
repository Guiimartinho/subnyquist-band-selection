# E15 - mascara de amostragem aprendida sob conjunto viavel (ADR 0006, Parte 2). Roda na GPU.
#
# Protocolo corrigido em 2026-11-11 pela revisao adversarial (ver o README, "Correcoes da
# revisao" e "Pre-registro"). O teste que decide esta no bloco `preregistration` e no README;
# mudar um dos dois depois de ver numero invalida o pre-registro.
#
# Conjuntos: so o Ottawa decide. O CWRU 48k sai da decisao (opcao (b) da revisao): 12 registros
# de pista externa, 1 de interna que nunca vai a teste, classe unica no teste e 3 unidades
# fisicas. Fica desligado, com o adaptador pronto. O MAFAULDA tambem fica desligado: no
# rolamento dele BPFO e BPFI coincidem com o 3o e o 5o harmonicos do eixo (E21).
seed: 20261113

datasets:
  ottawa:
    enabled: true
    kind: ottawa
    data_dir: datasets/raw/ottawa
    conditions: [I, O]
    scenarios: [A, B, C, D]
    trials: [1, 2, 3]
    pulses_per_rev: 1024
    segment_samples: 500000
    calibration_segment: 0           # regua aninhada: calibracao do segmento 0, como no E22
    test_segments: [1, 2]
    ceiling0_hz: 25000.0             # teto do E07/E22
    nominal: {n_elements: 9, geom_ratio: 0.206}
    # Acrescentar 48 e 64 aqui, se desejado. Nao usar 96 a 160 como alvo: ali o kurtograma
    # escolhe bandas mais estreitas que a falha em Hz, e a parede e do pipeline, nao da taxa.
    budgets: [4, 8, 16, 32]
    factor_grid_max: 48
    guard_points_per_rev_factor: 2.0 # a guarda do E22
    min_gap_ticks: 2                 # 10 us a 200 kSPS; o valor realizavel no SAADC e medida de bancada nao feita
    # Rodada corrigida (decisao do usuario, 2026-11-12): so a variante decisiva, a `bruto`. A
    # `sem_picos` (exige taxa cheia, nao decide nada) fica para uma rodada secundaria posterior.
    despike_variants: [false]
    healthy_control: {enabled: true, conditions: [H]}
    window_samples: 500000           # janela de treino = segmento (2,5 s), e o trecho da regua local
    # regua local: refino em taxa cheia numa grade deslizante de janelas de `window_samples`
    local_calibration: {hop_samples: 50000}
    decoder: {fs_env_hz: 2048.0, spr_ang: 256, n_fft: 32768}
  cwru48k:
    enabled: false                   # FORA DA DECISAO (opcao (b) da revisao), ver o cabecalho
    kind: cwru
    data_dir: datasets/raw/cwru
    catalog: datasets/catalogs/cwru-smith2015-categories.yaml
    table: classical
    subset: drive_end_48k
    point: DE
    fs_hz: 48000.0
    ceiling0_hz: null
    budgets: [2, 4, 8, 16]
    factor_grid_max: 24
    guard_points_per_rev_factor: 1.0 # 2,0 descartaria todo fator acima de 12 a ~30 Hz de eixo
    min_samples: 2048                # 4096 descartaria as metades de 148 e 161 em 1/16
    min_gap_ticks: 1
    despike_variants: [false]
    window_samples: 61440
    local_calibration: {hop_samples: 24000}
    decoder: {fs_env_hz: 2048.0, spr_ang: 128, n_fft: 32768}
  mafaulda:
    enabled: false                   # OPCAO DESLIGADA, ver o cabecalho
    kind: mafaulda
    data_dir: datasets/raw/mafaulda
    cache_dir: datasets/processed/mafaulda
    screen_catalog: datasets/catalogs/mafaulda-tachometer-screen.yaml
    bearings: [underhang, overhang]
    fault: outer_race
    fault_family: BPFO
    axis: radial
    ceiling0_hz: null
    budgets: [4, 8, 16]
    factor_grid_max: 16
    guard_points_per_rev_factor: 2.0
    min_gap_ticks: 1
    despike_variants: [false]
    window_samples: 102400
    local_calibration: {hop_samples: 51200}
    decoder: {fs_env_hz: 4096.0, spr_ang: 512, n_fft: 131072}

# pipeline classico: identico ao E22
min_samples: 4096
kurtogram: {max_level: 4, f_min_hz: 500.0}
prior: {score_harmonics: 3, calibration_span: 0.12}
tolerance_order: 0.06
samples_per_rev: 64
order_min: 2.0
order_max: 32.0                      # = samples_per_rev/2: a mesma faixa do argmax do E22
despike: {k_mad: 10.0}               # criterio do E20/E22

feasible:
  active_per_period: 4               # K; o periodo e L = K x orcamento
  timer_clock_hz: 16000000.0         # so para conferir se as contagens do TIMER saem inteiras

protocol:                            # divisoes por registro (arcabouco do E05)
  n_splits: 5
  # Uma semente de treino por divisao: a variabilidade de semente fica CONFUNDIDA com a de
  # divisao, e o bootstrap reamostra as divisoes (pre-registro). Subir este numero separa as
  # duas fontes; as linhas ganham a coluna `seed` e a media por registro passa sobre elas.
  seeds_per_split: 1
  test_fraction: 0.25
  val_fraction: 0.25

training:
  max_epochs: 500
  patience: 40
  windows_per_epoch: 64
  batch_size: 8
  # Uma taxa so, a mesma para todos os metodos aprendidos: orcamento de ajuste igual e nulo.
  lr_grid: [0.003]
  weight_decay: 0.0
  grad_clip: 5.0
  spacing_penalty: 1.0
  tau_start: 2.0
  tau_end: 0.3
  tau_anneal_epochs: 100
  # Regra B5, 2a aplicacao (2026-11-11): com lr x30, 1/16 ficou em 2/5; as 8 divisoes que nao
  # convergiram pararam antes do fim do recozimento (melhor epoca 22-84 < 100). Parada antecipada e
  # escolha de checkpoint so contam depois do recozimento, nos bracos com mascara aprendida.
  stop_after_anneal: true

decoder:
  init_levels: [1, 1.585, 2]         # bandas do kurtograma: 2 + 3 + 4 = 9 canais
  shifts: [-2, -1, 0, 1, 2]          # deslocamentos de fs/L do banco LPTV (R = 5 >= K = 4)
  n_control: 1024
  transition_frac: 0.1
  envelope_power: 2
  selection: sk
  sk_guard_frac: 0.05
  beta_init: 2.0

methods:
  - dec_uniforme
  - dec_aleatoria
  - dec_multicoset
  - dec_multicoset_vb
  - dec_uniforme_treino
  - dec_aprendida
  - dec_livre
  - dec_adaptativa
  - wdcnn
  # dec_loupe: opcional (LOUPE com straight-through); o gap de projecao da H2 usa dec_livre

mask:
  init: flat
  init_scale: 0.01
  relaxation: topk_st
  # A mascara tem taxa de aprendizado propria: com a do decodificador (0,003) e 8 passos por
  # epoca, os logits nao saem do ruido de Gumbel (desvio ~1,28). Os diagnosticos de saida
  # estao em masks.json (margem do top-K, posicoes iniciais e finais).
  # Regra B5 aplicada em 2026-11-11: na rodada com 10, mask_converged_frac de dec_aprendida
  # (bruto) foi 0,6 / 0,4 / 0,4 / 0,2 em 1/4 a 1/32 -> refazer com 30 (ver README).
  lr_multiplier: 30.0
livre: {period_multiple: 4}          # horizonte da mascara sem restricao: 4 periodos, 4K posicoes
loupe: {slope: 5.0, sample_slope: 12.0, period_multiple: 1}
adps: {n_blocks: 4, n_features: 16, hidden: 32}
multicoset: {criterion: min_peak_alias, max_enumeration: 3000000}
wdcnn: {input_length: 2048, batch_size: 64, windows_per_epoch: 512, max_val_windows_per_segment: 16}

# PRE-REGISTRO (espelho do README; o README e o registro de referencia)
preregistration:
  dataset: ottawa
  variant: bruto
  rulers: [local, nested]            # H1 e H2 so valem se as duas reguas concordarem
  metric: acuracia balanceada de ordem (media sobre as pistas do acerto |est - regua| < 0,06)
  alpha: 0.05
  correction: holm                   # sobre os testes de cada hipotese, por regua
  min_budgets: 2
  min_clusters_per_group: 3         # teste com menos aglomerados por pista nao e elegivel (p = 1)
  min_splits: 2
  # B5, avaliabilidade (2026-11-12, antes de qualquer numero de teste da rodada corrigida): um
  # orcamento so e avaliavel numa hipotese se a mascara de cada braco de `convergence_arms` saiu
  # do ruido em pelo menos esta fracao das divisoes; senao, seus testes entram no Holm com p = 1.
  min_mask_converged_frac: 0.5
  h1:
    arm: dec_aprendida_sel
    baselines: [uniforme_treino, dec_uniforme_treino, dec_aleatoria]
    convergence_arms: [dec_aprendida, dec_aprendida_sel]  # B5 como pre-registrado + mascara usada
  h2:
    arm: dec_aprendida
    baseline: dec_livre_projetada
    convergence_arms: [dec_aprendida, dec_livre_projetada]  # sem isso, baseline preso no ruido

analysis: {bootstrap_resamples: 4000}

compute: {workers: 30, device: auto}
output: {results_dir: results}
