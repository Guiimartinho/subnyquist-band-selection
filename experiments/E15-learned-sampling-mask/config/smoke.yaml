# E15 - SMOKE test on CPU: tests the loop, early stopping, resumption, the rulers, the statistics
# and the manifest. IT IS NOT A RESULT. Subset of base.yaml: Ottawa scenario A only (3 + 3 faulty
# records, 1 healthy), budgets 16 and 32, short windows, few epochs, one split and one seed.
# Results in results-smoke.
seed: 20261113

datasets:
  ottawa:
    enabled: true
    kind: ottawa
    data_dir: datasets/raw/ottawa
    conditions: [I, O]
    scenarios: [A]
    trials: [1, 2, 3]
    pulses_per_rev: 1024
    segment_samples: 500000
    calibration_segment: 0
    test_segments: [1, 2]
    ceiling0_hz: 25000.0
    nominal: {n_elements: 9, geom_ratio: 0.206}
    budgets: [16, 32]
    factor_grid_max: 34
    guard_points_per_rev_factor: 2.0
    min_gap_ticks: 2
    despike_variants: [false]
    healthy_control: {enabled: true, conditions: [H], scenarios: [A], trials: [1]}
    window_samples: 131072
    local_calibration: {hop_samples: 131072}
    decoder: {fs_env_hz: 2048.0, spr_ang: 256, n_fft: 32768}
  cwru48k:
    enabled: false
    kind: cwru
    data_dir: datasets/raw/cwru
    catalog: datasets/catalogs/cwru-smith2015-categories.yaml
    table: classical
    subset: drive_end_48k
    point: DE
    records: [135, 136, 148, 161, 213]
    fs_hz: 48000.0
    ceiling0_hz: null
    budgets: [8, 16]
    factor_grid_max: 18
    guard_points_per_rev_factor: 1.0
    min_samples: 2048
    min_gap_ticks: 1
    despike_variants: [false]
    window_samples: 61440
    local_calibration: {hop_samples: 30720}
    decoder: {fs_env_hz: 2048.0, spr_ang: 128, n_fft: 32768}

min_samples: 4096
kurtogram: {max_level: 4, f_min_hz: 500.0}
prior: {score_harmonics: 3, calibration_span: 0.12}
tolerance_order: 0.06
samples_per_rev: 64
order_min: 2.0
order_max: 32.0
despike: {k_mad: 10.0}

feasible:
  active_per_period: 4
  timer_clock_hz: 16000000.0

protocol:
  n_splits: 1
  seeds_per_split: 1
  test_fraction: 0.34
  val_fraction: 0.5

training:
  max_epochs: 6
  patience: 2
  windows_per_epoch: 4
  batch_size: 2
  lr_grid: [0.003]
  weight_decay: 0.0
  grad_clip: 5.0
  spacing_penalty: 1.0
  tau_start: 2.0
  tau_end: 0.3
  tau_anneal_epochs: 4
  stop_after_anneal: true

decoder:
  init_levels: [1, 1.585]
  shifts: [-1, 0, 1]
  n_control: 1024
  transition_frac: 0.1
  envelope_power: 2
  selection: sk
  sk_guard_frac: 0.05
  beta_init: 2.0

methods:
  - dec_uniforme
  - dec_aleatoria
  - dec_multicoset
  - dec_multicoset_vb
  - dec_uniforme_treino
  - dec_aprendida
  - dec_livre
  - dec_loupe
  - dec_adaptativa
  - wdcnn

mask: {init: flat, init_scale: 0.01, relaxation: topk_st, lr_multiplier: 10.0}
livre: {period_multiple: 4}
loupe: {slope: 5.0, sample_slope: 12.0, period_multiple: 1}
adps: {n_blocks: 4, n_features: 16, hidden: 32}
multicoset: {criterion: min_peak_alias, max_enumeration: 3000000}
wdcnn: {input_length: 2048, batch_size: 16, windows_per_epoch: 64, max_val_windows_per_segment: 4}

preregistration:
  dataset: ottawa
  variant: bruto
  rulers: [local, nested]
  metric: acuracia balanceada de ordem (media sobre as pistas do acerto |est - regua| < 0,06)
  alpha: 0.05
  correction: holm
  min_budgets: 2
  min_clusters_per_group: 3         # a test with fewer clusters per race is not eligible (p = 1)
  min_splits: 2
  # B5, evaluability (2026-11-12, before any test number of the corrected run): a budget is only
  # evaluable in a hypothesis if the mask of every arm in `convergence_arms` got out of the noise
  # in at least this fraction of the splits; otherwise, its tests enter Holm with p = 1.
  min_mask_converged_frac: 0.5
  h1:
    arm: dec_aprendida_sel
    baselines: [uniforme_treino, dec_uniforme_treino, dec_aleatoria]
    convergence_arms: [dec_aprendida, dec_aprendida_sel]  # B5 as preregistered + mask used
  h2:
    arm: dec_aprendida
    baseline: dec_livre_projetada
    convergence_arms: [dec_aprendida, dec_livre_projetada]  # without this, a baseline stuck in the noise

analysis: {bootstrap_resamples: 300}

compute: {workers: 4, device: cpu}
output: {results_dir: results-smoke}
