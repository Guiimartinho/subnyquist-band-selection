# E07 - undersampling degradation in the order domain, with real headroom.
#
# E02 measured CWRU, whose effective Nyquist saturates before the method does. Ottawa 2018 has
# ~28x of genuine headroom and, what matters more, an encoder: under variable rotation the
# fault frequency in hertz moves, but the ORDER does not.
seed: 20260903

data_dir: datasets/raw/ottawa
conditions: [I, O]
scenarios: [A, B, C, D]
trials: [1, 2, 3]

# 2,000,000 samples per record (10 s at 200 kSPS). Three disjoint windows of
# 2.5 s give ~37 revolutions each - order resolution ~0.027, ample for the
# tolerance below, and it triples n without repeating a setup.
segment_samples: 500000
segments_per_record: 3
min_samples: 4096

pulses_per_rev: 1024

kurtogram:
  max_level: 4
  # Below 500 Hz lies the structural content: 97% of the energy, no fault.
  f_min_hz: 500.0
  # Above 20 kHz there is 0.1% of the energy. The kurtosis of an almost empty band is dominated
  # by numerical leakage, and the kurtogram "finds" a transient where there is no
  # energy - which is what happened in 12/12 outer-race records, which
  # chose 50-100 kHz and showed no fault at all. Measured ceiling, not arbitrated.
  f_max_hz: 25000.0

# ER16K catalog geometry: 9 balls, ball diameter 0.3125", pitch diameter 1.516".
# It is NOT the ground truth - it is the nominal prior, whose deviation the experiment measures.
nominal:
  n_elements: 9
  geom_ratio: 0.206

prior:
  n_harmonics: 6
  score_harmonics: 3
  # Calibration range around the nominal order, for the calibrated prior.
  calibration_span: 0.12

# A hit when |estimated order - truth| < tolerance_order. The spread between
# records of the same condition is ~0.035 in orders; 0.06 covers it without being loose.
tolerance_order: 0.06
samples_per_rev: 64
order_min: 2.0

sweep:
  undersampling_factor: [1, 2, 4, 8, 16, 24, 32, 48, 64, 96, 128]

output:
  results_dir: results
