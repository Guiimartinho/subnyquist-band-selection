# Extended E07 - find the real knee of the curve, and separate it from the guard effect.
#
# The `base.yaml` sweep stopped on an ANALYSIS criterion, not on a drop in
# performance: factors 96 and 128 produced zero measurements and factor 64 produced 45 of 72
# (count checked in results/metrics.csv in this session: 216 rows per factor up to
# 48, 135 at factor 64, and 216 = 72 measurements x 3 modes).
#
# This config relaxes TWO of the three guards and re-runs the WHOLE list of factors,
# including the ones already evaluated. Without this control the run measures undersampling plus
# guard relaxation, and the two causes become indistinguishable. See the
# "Extension" section of the README.
#
# ----------------------------------------------------------------------------
# The three guards that decide whether a segment becomes a measurement
# ----------------------------------------------------------------------------
# All three are in run.py, in the function guard_verdict, and they are applied in this order -
# the first one to fire is the one that counts:
#   1  n_samples < int(cfg["min_samples"])
#   2  fs_eff_hz / 2.0 <= float(cfg["kurtogram"]["f_min_hz"])
#   3  points_per_rev < 2.0 * int(cfg["samples_per_rev"]),
#      with points_per_rev = fs_eff / float(np.max(v)) computed in the loop
#
# Calculation, with FS_HZ = 200000.0 (snq_data.ottawa.FS_HZ) and segment_samples = 500000.
#
# The rotation speed that enters the calculation is the WORST-CASE one, and it has two distinct
# values that must not be confused:
#   - 1953.1 rpm = 32.5517 Hz is the maximum of the RECORD (column rpm_hi of
#     results/metrics.csv, record I-A-3). It is a conservative upper bound.
#   - 1674.1 rpm = 27.9017 Hz is the maximum within an ANALYZED SEGMENT, measured
#     in this session by sweeping the 24 records x 3 windows. It is the value that the guard
#     actually sees, because the run.py loop uses np.max over the DECIMATED profile of the
#     segment. The 1953.1 rpm peak of I-A-3 falls in the last 500000 samples, which
#     segments_per_record = 3 never reaches (3 x 500000 = 1500000 of 2000000).
#
#  factor   fs_eff Hz   n=ceil(500000/f)   fs_eff/2 Hz   pts/rev @1953.1   @1674.1
#      64      3125.00               7813        1562.50            96.00    112.00
#      96      2083.33               5209        1041.67            64.00     74.67
#     128      1562.50               3907         781.25            48.00     56.00
#     160      1250.00               3125         625.00            38.40     44.80
#     192      1041.67               2605         520.83            32.00     37.33
#     256       781.25               1954         390.62            24.00     28.00
#
# The @1674.1 column is measured, not extrapolated: it is the minimum of fs_eff/max(v) over the
# 72 windows. The model of these three guards exactly reproduces the base run -
# 72 measurements per factor up to 48, 45 at factor 64, zero at 96 and 128 - and this is
# verified by tests/test_guards.py against results/metrics.csv, not checked by hand.
#
# HYPOTHESIS AND REFUTATION CRITERION of this run: sections "Hypothesis" and "What would refute
# this hypothesis" of the "Extension" part of the README. In one line: after subtracting, factor
# by factor, the guard step measured at the nine repeated factors, the hit rate with the
# calibrated prior at 96, 128 and 160 stays within 13 percentage points of that at 64x. A drop
# beyond that, or capture of the estimate by a fixed order (1.985, the 5th harmonic of the FTF),
# refutes.
#
# Reading the calculation, guard by guard:
#
# 1. min_samples = 4096 is what zeroes factor 128: ceil(500000/128) = 3907 < 4096.
#    It does not affect 96 (5209) or 64 (7813).
# 2. f_min_hz = 500 does NOT block 96 or 128: the guard requires fs_eff/2 > 500, and
#    781.25 > 500. It only becomes the binding guard from factor 200 on
#    (fs_eff/2 = 500.0). The reading that the 500 Hz floor zeroed 96 and 128 does not
#    hold up in the code. That is why f_min_hz stays UNCHANGED here - see the README.
# 3. samples_per_rev = 64 requires pts/rev >= 128, and at factor 64 the worst segment gives
#    112.00. This is the guard that discarded 27 of the 72 measurements of factor 64 and that
#    zeroes 96 (74.67) and 128 (56.00). It is the only guard that strictly needs relaxing.
seed: 20260903 # same as base: run.py uses no RNG, and the same seed keeps the comparison exact

data_dir: datasets/raw/ottawa
conditions: [I, O]
scenarios: [A, B, C, D]
trials: [1, 2, 3]

# Identical to base, on purpose: changing the window would change the number of revolutions per
# segment and would be a third confounder on the base x extended comparison.
segment_samples: 500000
segments_per_record: 3

# RELAXED: 4096 -> 2048. It must stay <= 3907 for factor 128 to produce a measurement.
# 2048 is the largest power of two that leaves the guard INERT across the whole sweep
# below: it would only bind again at factor 245 (ceil(500000/245) = 2041). That way the
# boundary of the extended curve is physical (points per revolution), not one of vector
# length. What the guard protects - enough length for the kurtogram to band-filter -
# remains satisfied: at factor 160 there are 3125 samples at 1250 Hz, the same
# 2.5 s window as all the other factors; decimating does not shorten the time.
min_samples: 2048

pulses_per_rev: 1024

kurtogram:
  max_level: 4
  # UNCHANGED at 500.0 Hz, and the choice is deliberate. Lowering this floor would let the
  # kurtogram search near DC, where the structural content is, and that is a
  # confounder that this run does not want to carry. The real value of that energy:
  # median of 14.86 % below 500 Hz (min 1.14 %, max 22.06 %), over the n = 24
  # fault records, FFT of the whole record - docs/lab-notebook/2026-09-07.md,
  # section "Two E07 premises were measured on one record and generalized to 24".
  # It is NOT the 97 % that the base.yaml comment (97 % below 500 Hz) and the docstring
  # of snq_data/ottawa.py (97 % below 50 Hz) claim; the <50 Hz band is contained
  # in the <500 Hz one, so the 14.86 % median bounds both.
  f_min_hz: 500.0
  # CORRECTION of the base.yaml comment, which under the label "Measured ceiling, not
  # arbitrated" claims 0.1 % of the energy above 20 kHz. Recomputed over the n = 24
  # fault records: median 5.02 % (min 2.97 %, max 6.83 %) - about 50x the
  # quoted value, same source as above.
  #
  # THE CEILING STAYS AT 25 kHz and the reported effect remains measured: without it, 12 of 12
  # outer-race records chose 50-100 kHz and the fault did not show up; with it,
  # it shows up at order ~3.4. What falls is the justification. The band above 20 kHz is not
  # numerically empty, so the sentence "there the kurtosis measures numerical leakage" is left
  # without basis, and the ceiling becomes what it always was in practice: a band prior of the
  # transducer, declared as such and not as a consequence of zero energy.
  f_max_hz: 25000.0

# ER16K catalog geometry: 9 balls, ball diameter 0.3125", pitch diameter 1.516".
# It is NOT the ground truth - it is the nominal prior, whose deviation the experiment measures.
nominal:
  n_elements: 9
  geom_ratio: 0.206

prior:
  n_harmonics: 6
  score_harmonics: 3
  calibration_span: 0.12

tolerance_order: 0.06

# RELAXED: 64 -> 16. It is the only guard that needs to give way for 96 and 128 to exist.
# Calculation: the guard requires pts/rev >= 2*spr. At factor 128, the conservative upper bound
# (1953.1 rpm) gives 48.00 points per revolution, so spr <= 24; the worst measured segment
# (1674.1 rpm) gives 56.00, so spr <= 28. Choosing 24 or 28 means sitting on the threshold of
# the conservative column, and then a rotation shift is enough for a record to leave the
# sample silently - exactly the selection bias that this run exists to
# remove. 16 leaves headroom in both columns: 48/32 = 1.5x and 56/32 = 1.75x at factor
# 128, 38.40/32 = 1.2x and 44.80/32 = 1.4x at 160.
#
# EXECUTED in tests/test_guards.py, over the 24 real records x 3 windows (this is not a
# prediction): with spr = 16 the three guards let all 72 measurements through at ALL twelve
# factors of the list below, including 96, 128 and 160. The same test checks that, under
# base.yaml, the model returns 72 up to factor 48, 45 at 64 and zero at 96 and 128 - which is
# what results/metrics.csv contains. No factor enters with a reduced n, so no
# difference in the curve will be a change of denominator - the defect found in E02 48k.
# What is executed is segment ADMISSION; the hit rate at these factors is not.
#
# The price is declared and it is not small: spr = 16 puts the Nyquist of the ORDER spectrum
# at 8, against 32 in base. Three consequences, all of them confounders of the comparison:
#   (a) score_fault folds the harmonics above that Nyquist instead of discarding them
#       (diagnosis.py:114-119), so the score changes composition;
#   (b) estimate_from_candidates discards candidates above the Nyquist of the spectrum
#       (diagnosis.py:185), so the candidate set SHRINKS - of the 24 candidates
#       of the nominal prior, 23 survive under spr = 64 and only 12 under spr = 16;
#   (c) the TRUTH ITSELF moves: the reference order comes from the same angular
#       resampling, in pass 1 of run.py, which uses this spr. Measured on the 24 records: per
#       record the shift has a median of 0.005 orders and a maximum of 0.095, and 1 of the 24
#       exceeds the 0.06 tolerance; in the leave-one-out median that enters the
#       comparison the effect drops to <= 0.0025 orders.
#
# The SIGN of the guard effect was MEASURED, and it is not what an earlier version of this
# comment assumed. Reprocessing the same segments under both spr, mode with the calibrated
# prior, paired comparison: 1x -6.9 / 8x -4.2 / 16x -8.3 / 32x -11.1 / 48x -1.4 /
# 64x -2.2 percentage points. The relaxation WORSENS the hit rate at the six measured factors,
# and the step is NOT constant - it varies from -1.4 to -11.1. So the subtraction of the step has
# to be done factor by factor; a single value does not work.
# That is why the sweep below repeats the factors already measured: it is the only way to read
# the guard effect separately from the rate effect.
#
# The order resolution is NOT affected: order_spectrum returns rfftfreq(n, 1/spr) with
# n = revolutions*spr, so the step is 1/revolutions, independent of spr.
samples_per_rev: 16

order_min: 2.0

sweep:
  # The WHOLE base list, plus 96, 128 and 160. The first nine are the guard
  # control: run here under spr = 16 and min_samples = 2048, they are compared row by row
  # with results/metrics.csv, which measured them under spr = 64 and min_samples = 4096.
  #
  # It stops at 160, and the reason is NOT the points-per-revolution guard - it is the width of
  # the kurtogram search window, [f_min_hz, fs_eff/2], which collapses against the floor:
  #
  #   factor   search window   width Hz   sub-band Hz   FFT bins per band
  #       64  500-1562.50 Hz    1062.50        66.406               166.0
  #       96  500-1041.67 Hz     541.67        33.854                84.7
  #      128   500-781.25 Hz     281.25        17.578                44.0
  #      160   500-625.00 Hz     125.00         7.812                19.5
  #      192   500-520.83 Hz      20.83         1.302                 3.3
  #
  # (the finest level of max_level = 4 splits the window into 2**4 = 16 sub-bands;
  #  bins = sub-band width / (fs_eff/n), with n = ceil(500000/factor).)
  # At factor 192 each sub-band of the finest level has 3 bins: band selection
  # stops being a measurement. The sign of this already shows in the decline of the chosen
  # kurtosis in I-A-3 seg 0, measured in this session: 3.6 at factor 64, 1.9 at 96, 2.1 at 128,
  # 0.5 at 160. And at factor 256 two guards zero the factor: min_samples fires first
  # (ceil(500000/256) = 1954 < 2048) and, if it did not fire, fs_eff/2 = 390.62 Hz <= 500 Hz
  # would zero it as well. Going beyond 160 requires changing f_min_hz - which this run
  # refuses to do, so as not to add a third confounder.
  undersampling_factor: [1, 2, 4, 8, 16, 24, 32, 48, 64, 96, 128, 160]

output:
  # New subfolder, following the pattern of E02-bandpass-envelope-cwru/config/cwru48k.yaml,
  # which writes to results/48k/. results/metrics.csv (the base run) stays intact.
  results_dir: results/extended
