[project]
name = "snq-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snq_core"]

[tool.uv.sources]
snq-core = { workspace = true }
snq-sim  = { workspace = true }
snq-learn = { workspace = true }
