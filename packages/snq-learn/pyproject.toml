[project]
name = "snq-learn"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "torch>=2.4", "snq-core", "snq-sim"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snq_learn"]

[tool.uv.sources]
snq-core = { workspace = true }
snq-sim  = { workspace = true }
snq-learn = { workspace = true }
